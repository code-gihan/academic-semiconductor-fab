[workspace]
members = ["crates/*"]
# The Python module is built by maturin (crates/python/pyproject.toml).
default-members = ["crates/cli", "crates/des-core", "crates/smt2020", "crates/wasm"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
