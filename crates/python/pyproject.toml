[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "smt2020"
description = "SMT2020 semiconductor fab simulator: datasets, operating strategies, step-wise runs and replication statistics"
requires-python = ">=3.9"
dynamic = ["version"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://code-gihan.github.io/academic-semiconductor-fab/"
Source = "https://github.com/code-gihan/academic-semiconductor-fab"

[tool.maturin]
module-name = "smt2020"
features = ["pyo3/extension-module"]
