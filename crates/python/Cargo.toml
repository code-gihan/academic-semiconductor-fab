[package]
name = "smt2020-python"
description = "Python module of the SMT2020 simulator"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py39"] }
pythonize = "0.29"
serde = "1"
smt2020 = { path = "../smt2020" }
