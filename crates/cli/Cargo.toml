[package]
name = "smt2020-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "smt2020"
path = "src/main.rs"

[dependencies]
calamine = "0.36"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smt2020 = { path = "../smt2020" }
