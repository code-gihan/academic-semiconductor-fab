name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  wheels:
    name: Python wheel (${{ matrix.os }})
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: windows-latest
            target: x64
          - os: macos-latest
            target: universal2-apple-darwin
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --locked --out dist -m crates/python/Cargo.toml

      - name: Test wheel
        shell: bash
        run: |
          python -m pip install --no-index --find-links dist smt2020
          python -m unittest discover -s crates/python/tests -v

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl

  build:
    needs: wheels
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test
        run: cargo test --locked

      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Build wasm
        run: cargo build --release --locked --target wasm32-unknown-unknown -p fab-wasm

      - name: Install wasm-bindgen-cli
        # Must be the exact wasm-bindgen version in Cargo.lock.
        run: cargo install wasm-bindgen-cli --locked --version "$(cargo pkgid wasm-bindgen | sed 's/.*@//')"

      - name: Generate JS bindings
        run: wasm-bindgen --target web --no-typescript --out-dir www/pkg target/wasm32-unknown-unknown/release/fab_wasm.wasm

      - name: Test JavaScript API
        run: node --test crates/wasm/tests/api.test.mjs

      - name: Collect wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: www/python

      # The index lists the wheels for the page and for pip --find-links.
      - name: Index wheels
        working-directory: www/python
        run: |
          {
            echo '<!doctype html><html lang="en"><head><meta charset="utf-8"><title>smt2020 wheels</title></head><body>'
            for wheel in *.whl; do echo "<a href=\"$wheel\">$wheel</a><br>"; done
            echo '</body></html>'
          } > index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
